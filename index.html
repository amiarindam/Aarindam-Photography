<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#171717"><title>Aarindam Photography Billing</title>
<style>
:root{--bg:#101010;--panel:#1b1b1b;--panel2:#242424;--gold:#d6b36b;--gold2:#f0d99e;--muted:#aaa;--line:#343434;--green:#72d39a;--red:#ff8585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f5f5;font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:88px}.top{background:#171717;padding:20px 17px 16px;border-bottom:1px solid #35302a;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#f0d99e,#a77b34);display:grid;place-items:center;color:#171717;font-size:23px}.brand h1{font-size:16px;letter-spacing:1.2px;color:var(--gold2);margin:0}.brand small{color:#aaa;font-size:10px;letter-spacing:1px}.tag{margin-left:auto;border:1px solid #635333;color:var(--gold2);border-radius:20px;padding:5px 9px;font-size:10px}.content{padding:16px}.welcome h2{margin:5px 0 2px;font-size:23px}.welcome p{margin:0;color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}.stat small,.muted{color:var(--muted);font-size:12px}.stat strong{display:block;color:var(--gold2);font-size:21px;margin-top:5px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#171717;border-top:1px solid #39332a;display:flex;justify-content:center;z-index:8;padding:8px max(8px,calc((100vw - 760px)/2)) calc(8px + env(safe-area-inset-bottom))}.tabs button{flex:1;max-width:150px;border:0;background:transparent;color:#aaa;padding:7px 2px;font-size:11px}.tabs button span{display:block;font-size:19px;margin-bottom:2px}.tabs button.active{color:var(--gold2)}h3{font-size:17px;margin:4px 0 12px}.section{margin-top:18px}.field{margin:10px 0}.field label{display:block;color:#c9c9c9;font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:#111;color:white;border:1px solid #444;border-radius:10px;padding:12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:650}.primary{background:var(--gold);color:#171717}.secondary{background:#303030;color:#fff;border:1px solid #484848}.danger{background:#4a2525;color:#ffb0b0}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btnrow .btn{flex:1}.totalbox{background:#252117;border:1px solid #635333;border-radius:13px;padding:14px;margin:14px 0}.totalrow{display:flex;justify-content:space-between;margin:7px 0;font-size:14px}.totalrow.big{border-top:1px solid #635333;padding-top:10px;font-size:17px;font-weight:750;color:var(--gold2)}.green{color:var(--green)}.red{color:var(--red)}.listitem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin:9px 0}.listitem .row{display:flex;justify-content:space-between;gap:10px;align-items:center}.listitem strong{font-size:14px}.pill{font-size:10px;border:1px solid #655536;border-radius:20px;padding:3px 7px;color:var(--gold2)}.empty{text-align:center;color:#999;padding:25px 10px}.smallbtn{font-size:11px;padding:7px 9px;border-radius:8px;border:1px solid #555;background:#292929;color:#eee}.hint{font-size:11px;color:#999;line-height:1.5}.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:14px 0}.brandfoot{text-align:center;color:#9c824e;font-size:11px;padding:20px}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modalbox{background:#1c1c1c;border:1px solid #555;border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:760px;max-height:85vh;overflow:auto}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#eee;color:#111;padding:10px 15px;border-radius:9px;z-index:30;font-size:13px;display:none}
@media(min-width:600px){.content{padding:22px}.modal{align-items:center}.modalbox{border-radius:18px}}
@media print{body{background:#fff;color:#111}.top,.tabs,.no-print{display:none!important}.app{max-width:none;padding:0}.content{padding:0}.invoice-paper{display:block!important;color:#111!important;background:#fff!important;border:0!important;padding:22px!important}.invoice-paper *{color:#111!important}.invoice-paper .goldline{border-color:#b28a3c!important}.invoice-paper table{width:100%;border-collapse:collapse;margin-top:18px}.invoice-paper th,.invoice-paper td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.invoice-paper th:last-child,.invoice-paper td:last-child{text-align:right}.invoice-paper .invtotal{margin-left:auto;width:260px}.invoice-paper .invtotal div{display:flex;justify-content:space-between;padding:5px}.invoice-paper .invhead{display:flex;justify-content:space-between;border-bottom:2px solid #b28a3c;padding-bottom:15px}.invoice-paper .invfoot{margin-top:50px;border-top:1px solid #ddd;padding-top:12px;font-size:12px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">📷</div><div><h1>AARINDAM PHOTOGRAPHY</h1><small>BILLING & BUSINESS MANAGER</small></div><div class="tag">OFFLINE APP</div></div></header><main class="content" id="main"></main><nav class="tabs"><button data-tab="home" class="active"><span>⌂</span>Home</button><button data-tab="invoice"><span>＋</span>Invoice</button><button data-tab="records"><span>▤</span>Records</button><button data-tab="expenses"><span>−</span>Expenses</button><button data-tab="reports"><span>▥</span>Reports</button></nav></div><div class="toast" id="toast"></div><div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<script>
const KEY='aarindam_photo_billing_v1';let db=load(),tab='home',draftItems={},editingId=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{invoices:[],expenses:[],settings:{business:'Aarindam Photography',phone:'',address:'',prefix:'AP'}}}catch(e){return{invoices:[],expenses:[],settings:{business:'Aarindam Photography',phone:'',address:'',prefix:'AP'}}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function money(n){return '₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}function id(){return 'i'+Date.now()+Math.random().toString(16).slice(2,6)}function nextNo(){let nums=db.invoices.map(x=>parseInt((x.number||'').split('-').pop(),10)||0);return (db.settings.prefix||'AP')+'-'+String(Math.max(0,...nums)+1).padStart(4,'0')}function sumInvoice(x){return (x.items||[]).reduce((a,b)=>a+Number(b.amount||0),0)}function paidInvoice(x){return (x.payments||[]).reduce((a,b)=>a+Number(b.amount||0),0)}function go(t){tab=t;render();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));window.scrollTo(0,0)}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function render(){let m=document.getElementById('main');if(tab==='home')m.innerHTML=home();if(tab==='invoice')m.innerHTML=invoiceForm();if(tab==='records')m.innerHTML=records();if(tab==='expenses')m.innerHTML=expenseForm();if(tab==='reports')m.innerHTML=reports();}
function home(){let revenue=db.invoices.reduce((a,x)=>a+sumInvoice(x),0),received=db.invoices.reduce((a,x)=>a+paidInvoice(x),0),due=revenue-received,cost=db.expenses.reduce((a,x)=>a+Number(x.amount),0);return `<div class="welcome"><h2>Business Dashboard</h2><p>Welcome back. Your photography business at a glance.</p></div><div class="stats"><div class="stat"><small>Total billed</small><strong>${money(revenue)}</strong></div><div class="stat"><small>Payments received</small><strong>${money(received)}</strong></div><div class="stat"><small>Outstanding</small><strong>${money(due)}</strong></div><div class="stat"><small>Expenses</small><strong>${money(cost)}</strong></div></div><div class="card"><div class="row" style="display:flex;justify-content:space-between;align-items:center"><div><small class="muted">ESTIMATED NET PROFIT</small><div style="font-size:25px;color:${revenue-cost>=0?'var(--green)':'var(--red)'};font-weight:750">${money(revenue-cost)}</div></div><div style="font-size:32px">📊</div></div><p class="hint">Calculated as total invoices minus recorded expenses. Add every business cost for a more accurate figure.</p></div><div class="section"><h3>Quick actions</h3><div class="grid2"><button class="btn primary" onclick="go('invoice')">＋ New invoice</button><button class="btn secondary" onclick="go('expenses')">＋ Add expense</button></div></div><div class="section"><h3>Recent invoices</h3>${db.invoices.length?db.invoices.slice().reverse().slice(0,3).map(invoiceCard).join(''):'<div class="empty">No invoices yet. Create your first invoice.</div>'}</div><div class="brandfoot">AARINDAM PHOTOGRAPHY · Capturing Moments, Creating Memories</div>`}
function invoiceForm(){let old=editingId?db.invoices.find(x=>x.id===editingId):null;let items=old?old.items:[{name:'Photography / Cinematography',amount:0},{name:'Travel',amount:0},{name:'Editing',amount:0},{name:'Others',amount:0}];let total=items.reduce((a,x)=>a+Number(x.amount||0),0),paid=old?paidInvoice(old):0;return `<h3>${old?'Edit invoice':'Create new invoice'}</h3><form id="invform" onsubmit="return false"><div class="grid2"><div class="field"><label>Invoice number</label><input id="invno" value="${esc(old?.number||nextNo())}" required></div><div class="field"><label>Invoice date</label><input id="invdate" type="date" value="${esc(old?.date||new Date().toISOString().slice(0,10))}" required></div></div><div class="field"><label>Client name *</label><input id="client" placeholder="Enter client name" value="${esc(old?.client||'')}" required></div><div class="grid2"><div class="field"><label>Phone number</label><input id="phone" type="tel" placeholder="Client mobile" value="${esc(old?.phone||'')}"></div><div class="field"><label>Event type</label><select id="event">${['Wedding Photography','Pre-Wedding Shoot','Haldi / Mehendi','Engagement','Birthday / Party','Concert / Stage Event','Commercial Shoot','Photoshoot','Reels','Other'].map(v=>`<option ${old?.event===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="divider"></div><h3>Service charges</h3>${items.map((it,i)=>`<div class="field"><label>${esc(it.name)} (₹)</label><input class="charge" data-i="${i}" type="number" min="0" step="0.01" inputmode="decimal" value="${Number(it.amount)||''}" placeholder="0.00"></div>`).join('')}<div class="totalbox"><div class="totalrow"><span>Total amount</span><strong id="liveTotal">${money(total)}</strong></div><div class="totalrow"><span>Previously received</span><strong>${money(paid)}</strong></div><div class="totalrow big"><span>Balance before new payment</span><span id="liveDue">${money(total-paid)}</span></div></div><div class="field"><label>${old?'Add another payment (₹)':'Advance / amount received (₹)'}</label><input id="payment" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></div><div class="field"><label>Payment method</label><select id="paymethod"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Card</option><option>Other</option></select></div><div class="field"><label>Notes (optional)</label><textarea id="notes" rows="2" placeholder="Additional details">${esc(old?.notes||'')}</textarea></div><div class="btnrow"><button class="btn primary" onclick="saveInvoice()">${old?'Update invoice':'Save invoice'}</button><button type="button" class="btn secondary" onclick="editingId=null;go('records')">Cancel</button></div></form><p class="hint">Invoices and payments are saved on this device. Keep a separate backup of your data.</p>`}
document.addEventListener('input',e=>{if(e.target.classList.contains('charge')){let vals=[...document.querySelectorAll('.charge')].map(x=>Number(x.value)||0),tot=vals.reduce((a,b)=>a+b,0);let paid=editingId?paidInvoice(db.invoices.find(x=>x.id===editingId)):0;let t=document.getElementById('liveTotal'),d=document.getElementById('liveDue');if(t)t.textContent=money(tot);if(d)d.textContent=money(tot-paid)}});
function saveInvoice(){let client=document.getElementById('client').value.trim();if(!client){toast('Please enter client name');return}let charges=[...document.querySelectorAll('.charge')].map((x,i)=>({name:['Photography / Cinematography','Travel','Editing','Others'][i],amount:Number(x.value)||0}));if(charges.reduce((a,x)=>a+x.amount,0)<=0){toast('Enter at least one service charge');return}let pay=Number(document.getElementById('payment').value)||0;let old=editingId?db.invoices.find(x=>x.id===editingId):null;let inv={id:old?.id||id(),number:document.getElementById('invno').value.trim(),date:document.getElementById('invdate').value,client,phone:document.getElementById('phone').value.trim(),event:document.getElementById('event').value,items:charges,notes:document.getElementById('notes').value.trim(),payments:old?[...(old.payments||[])]:[]};if(pay>0)inv.payments.push({amount:pay,method:document.getElementById('paymethod').value,date:new Date().toISOString().slice(0,10)});if(old)db.invoices[db.invoices.findIndex(x=>x.id===old.id)]=inv;else db.invoices.push(inv);save();editingId=null;toast('Invoice saved successfully');go('records')}
function invoiceCard(x){let total=sumInvoice(x),paid=paidInvoice(x);return `<div class="listitem"><div class="row"><strong>${esc(x.client)}</strong><span class="pill">${esc(x.number)}</span></div><div class="row" style="margin-top:7px"><span class="muted">${esc(x.event)} · ${esc(x.date)}</span><strong>${money(total)}</strong></div><div class="row" style="margin-top:7px"><span class="muted">Received ${money(paid)}</span><span class="${total-paid>0?'red':'green'}">${total-paid>0?'Due '+money(total-paid):'Paid'}</span></div><div class="btnrow"><button class="smallbtn" onclick="viewInvoice('${x.id}')">View / PDF</button><button class="smallbtn" onclick="editInvoice('${x.id}')">Edit</button><button class="smallbtn" onclick="addPayment('${x.id}')">Add payment</button><button class="smallbtn" onclick="shareInvoice('${x.id}')">WhatsApp</button></div></div>`}
function records(){return `<h3>Invoice records</h3><button class="btn primary" style="width:100%" onclick="editingId=null;go('invoice')">＋ Create invoice</button><div class="section">${db.invoices.length?db.invoices.slice().reverse().map(invoiceCard).join(''):'<div class="empty">No saved invoices yet.</div>'}</div><div class="divider"></div><h3>Data backup</h3><p class="hint">Export your invoices and expenses to a JSON backup file. Keep it somewhere safe.</p><button class="btn secondary" style="width:100%" onclick="backup()">⬇ Export backup</button><div class="field"><label>Restore backup file</label><input type="file" id="restorefile" accept="application/json" onchange="restoreBackup(event)"></div><button class="btn secondary" style="width:100%" onclick="settings()">⚙ Business settings</button>`}
function editInvoice(i){editingId=i;go('invoice')}
function addPayment(i){let x=db.invoices.find(x=>x.id===i);showModal(`<h3>Add payment · ${esc(x.number)}</h3><p class="muted">Outstanding: ${money(sumInvoice(x)-paidInvoice(x))}</p><div class="field"><label>Amount received (₹)</label><input id="addpayamt" type="number" min="0" step="0.01"></div><div class="field"><label>Payment method</label><select id="addpaymethod"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Card</option><option>Other</option></select></div><button class="btn primary" style="width:100%" onclick="confirmPayment('${i}')">Save payment</button>`)}function confirmPayment(i){let a=Number(document.getElementById('addpayamt').value)||0;if(a<=0){toast('Enter a valid amount');return}let x=db.invoices.find(x=>x.id===i);x.payments.push({amount:a,method:document.getElementById('addpaymethod').value,date:new Date().toISOString().slice(0,10)});save();closeModal();render();toast('Payment added')}
function viewInvoice(i){let x=db.invoices.find(x=>x.id===i);let total=sumInvoice(x),paid=paidInvoice(x);showModal(`<div class="invoice-paper" id="printarea"><div class="invhead"><div><h2 style="margin:0;color:#a77b34">${esc(db.settings.business)}</h2><div>${esc(db.settings.address||'Photography · Cinematography · Events')}</div><div>${esc(db.settings.phone||'')}</div></div><div style="text-align:right"><h2 style="margin:0">INVOICE</h2><b>${esc(x.number)}</b><div>${esc(x.date)}</div></div></div><p><b>Bill To:</b> ${esc(x.client)}<br><b>Phone:</b> ${esc(x.phone||'—')}<br><b>Event:</b> ${esc(x.event)}</p><table><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody>${x.items.map(it=>`<tr><td>${esc(it.name)}</td><td>${money(it.amount)}</td></tr>`).join('')}</tbody></table><div class="invtotal"><div><span>Total</span><b>${money(total)}</b></div><div><span>Received</span><b>${money(paid)}</b></div><div style="border-top:1px solid #aaa;font-size:18px"><b>Balance due</b><b>${money(total-paid)}</b></div></div><p><b>Payment history</b><br>${(x.payments||[]).length?x.payments.map(p=>`${esc(p.date)} · ${esc(p.method)} · ${money(p.amount)}`).join('<br>'):'No payment received yet'}</p>${x.notes?`<p><b>Notes:</b> ${esc(x.notes)}</p>`:''}<div class="invfoot">Thank you for choosing ${esc(db.settings.business)}.<br>Capturing Moments · Creating Memories</div></div><div class="btnrow no-print"><button class="btn primary" onclick="printInvoice()">Print / Save PDF</button><button class="btn secondary" onclick="shareInvoice('${i}')">WhatsApp</button></div>`)}function printInvoice(){window.print()}
function shareInvoice(i){let x=db.invoices.find(x=>x.id===i),t=sumInvoice(x),p=paidInvoice(x);let msg=`${db.settings.business}\nInvoice: ${x.number}\nClient: ${x.client}\nEvent: ${x.event}\nDate: ${x.date}\nTotal: ${money(t)}\nReceived: ${money(p)}\nBalance due: ${money(t-p)}\n\nThank you!`;let url='https://wa.me/'+(x.phone||'').replace(/\D/g,'')+'?text='+encodeURIComponent(msg);if(navigator.share)navigator.share({text:msg}).catch(()=>{});else window.open(url,'_blank')}
function expenseForm(){return `<h3>Business expenses</h3><div class="card"><div class="field"><label>Expense category</label><select id="excat">${['Shoot expenses','Travel / Fuel','Equipment purchase','Camera maintenance','Staff / Assistant payment','Food / Accommodation','Software / Subscription','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Amount (₹) *</label><input id="examount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Enter amount"></div><div class="field"><label>Date</label><input id="exdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Notes</label><textarea id="exnote" rows="2" placeholder="Expense details"></textarea></div><button class="btn primary" style="width:100%" onclick="saveExpense()">Save expense</button></div><div class="section"><h3>Expense history · ${money(db.expenses.reduce((a,x)=>a+x.amount,0))}</h3>${db.expenses.length?db.expenses.slice().reverse().map(x=>`<div class="listitem"><div class="row"><strong>${esc(x.category)}</strong><b>${money(x.amount)}</b></div><div class="muted">${esc(x.date)} ${x.note?'· '+esc(x.note):''}</div><div style="text-align:right;margin-top:6px"><button class="smallbtn" onclick="deleteExpense('${x.id}')">Delete</button></div></div>`).join(''):'<div class="empty">No expenses recorded yet.</div>'}</div>`}
function saveExpense(){let a=Number(document.getElementById('examount').value)||0;if(a<=0){toast('Enter a valid expense amount');return}db.expenses.push({id:id(),category:document.getElementById('excat').value,amount:a,date:document.getElementById('exdate').value,note:document.getElementById('exnote').value.trim()});save();toast('Expense saved');render()}
function deleteExpense(i){if(confirm('Delete this expense record?')){db.expenses=db.expenses.filter(x=>x.id!==i);save();render()}}
function reports(){let rev=db.invoices.reduce((a,x)=>a+sumInvoice(x),0),paid=db.invoices.reduce((a,x)=>a+paidInvoice(x),0),cost=db.expenses.reduce((a,x)=>a+x.amount,0);let by={};db.expenses.forEach(x=>by[x.category]=(by[x.category]||0)+x.amount);return `<h3>Business reports</h3><div class="stats"><div class="stat"><small>Total billed</small><strong>${money(rev)}</strong></div><div class="stat"><small>Received</small><strong>${money(paid)}</strong></div><div class="stat"><small>Outstanding</small><strong>${money(rev-paid)}</strong></div><div class="stat"><small>Total expenses</small><strong>${money(cost)}</strong></div></div><div class="card"><small class="muted">ESTIMATED PROFIT / LOSS</small><div style="font-size:27px;font-weight:800;color:${rev-cost>=0?'var(--green)':'var(--red)'}">${money(rev-cost)}</div><p class="hint">Revenue recorded in invoices minus all saved expenses. This is a simple operational estimate, not a tax or accounting statement.</p></div><div class="section"><h3>Expense breakdown</h3>${Object.keys(by).length?Object.entries(by).map(([k,v])=>`<div class="totalrow"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join(''):'<div class="empty">No expenses to report.</div>'}</div><div class="section"><h3>Payment collection</h3><div class="totalrow"><span>Received</span><b class="green">${money(paid)}</b></div><div class="totalrow"><span>Pending</span><b class="red">${money(rev-paid)}</b></div></div>`}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Aarindam-Photography-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.invoices)||!Array.isArray(d.expenses))throw 0;if(confirm('Restore backup? This will replace the data currently on this device.')){db=d;save();render();toast('Backup restored')}}catch(_){toast('Invalid backup file')}};r.readAsText(f)}
function settings(){showModal(`<h3>Business settings</h3><div class="field"><label>Business name</label><input id="setname" value="${esc(db.settings.business)}"></div><div class="field"><label>Business phone</label><input id="setphone" value="${esc(db.settings.phone)}"></div><div class="field"><label>Business address</label><textarea id="setaddress">${esc(db.settings.address)}</textarea></div><div class="field"><label>Invoice prefix</label><input id="setprefix" value="${esc(db.settings.prefix)}"></div><button class="btn primary" style="width:100%" onclick="saveSettings()">Save settings</button>`)}function saveSettings(){db.settings={business:document.getElementById('setname').value.trim()||'Aarindam Photography',phone:document.getElementById('setphone').value.trim(),address:document.getElementById('setaddress').value.trim(),prefix:document.getElementById('setprefix').value.trim()||'AP'};save();closeModal();render();toast('Settings saved')}
function showModal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
</script></body></html>
